[package]
name = "folderblog"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
include_dir = "0.7.4"
minijinja = { version = "2.24.0", features = ["loader", "json", "urlencode", "builtins"] }
minijinja-contrib = { version = "2.24.0", features = ["datetime", "pycompat", "wordcount"] }
notify = "8.2.0"
pulldown-cmark = "0.13.4"
quick-xml = "0.42.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tiny_http = "0.12.0"
toml = "1.1.6"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

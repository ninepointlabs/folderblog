[package]
name = "folderblog"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "A folder is a blog: save Markdown into a folder and it is published to GitHub Pages (or anywhere) seconds later."
license = "MIT"
repository = "https://github.com/ninepointlabs/folderblog"
homepage = "https://github.com/ninepointlabs/folderblog"
readme = "README.md"
authors = ["Tim <tim@ninepointlabs.com>"]
keywords = ["blog", "static-site", "markdown", "github-pages"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "rayon"] }
include_dir = "0.7.4"
kamadak-exif = "0.6"
minijinja = { version = "2.24.0", features = ["loader", "json", "urlencode", "builtins"] }
minijinja-contrib = { version = "2.24.0", features = ["datetime", "pycompat", "wordcount"] }
notify = "8.2.0"
pulldown-cmark = "0.13.4"
quick-xml = "0.42.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tiny_http = "0.12.0"
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"

[package.metadata.deb]
maintainer = "Tim <tim@ninepointlabs.com>"
section = "web"
priority = "optional"
depends = "git"
recommends = "libnotify-bin"
extended-description = """\
folderblog watches a folder of blogs. Save a Markdown file and the blog is rebuilt and \
published seconds later: to GitHub Pages (repo and Pages set up automatically), a git \
branch, or any command such as rsync. Themes are plain Jinja templates with an \
AGENTS.md contract so coding agents can design them."""
assets = [
    ["target/release/folderblog", "usr/bin/", "755"],
    ["packaging/folderblog.service", "usr/lib/systemd/user/", "644"],
    ["README.md", "usr/share/doc/folderblog/README.md", "644"],
    ["docs/GUIDE.md", "usr/share/doc/folderblog/GUIDE.md", "644"],
    ["target/man/folderblog.1.gz", "usr/share/man/man1/folderblog.1.gz", "644"],
    ["LICENSE", "usr/share/licenses/folderblog/LICENSE", "644"],
]

[package.metadata.generate-rpm]
summary = "A folder is a blog: save Markdown, it goes live"
assets = [
    { source = "target/release/folderblog", dest = "/usr/bin/folderblog", mode = "755" },
    { source = "packaging/folderblog.service", dest = "/usr/lib/systemd/user/folderblog.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/folderblog/README.md", mode = "644", doc = true },
    { source = "docs/GUIDE.md", dest = "/usr/share/doc/folderblog/GUIDE.md", mode = "644", doc = true },
    { source = "target/man/folderblog.1.gz", dest = "/usr/share/man/man1/folderblog.1.gz", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/folderblog/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
git = "*"
